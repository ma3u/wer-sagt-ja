name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typen
      - run: npm test
      - run: npm run build

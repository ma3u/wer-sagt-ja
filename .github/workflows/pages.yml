name: GitHub Pages

# Baut die App und veröffentlicht sie unter https://wersagtja.de/ (eigene Domain in den Pages-Einstellungen).
# Die alte Adresse https://<konto>.github.io/<repository>/ leitet GitHub dorthin weiter – samt #/…-Teil.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5

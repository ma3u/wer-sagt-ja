name: GitHub Pages

# Baut die App und veröffentlicht sie unter https://wersagtja.de/ (eigene Domain in den Pages-Einstellungen).
# Die alte Adresse https://<konto>.github.io/<repository>/ leitet GitHub dorthin weiter – samt #/…-Teil.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
  # Meldet alle Adressen aus der Sitemap über IndexNow (Bing, Yandex, Seznam u. a.). Der Schlüssel ist öffentlich und
  # liegt als public/<schlüssel>.txt auf der Seite – so prüft IndexNow, dass die Meldung von uns kommt.
  melden:
    needs: veroeffentlichen
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - run: |
          schluessel=49674f3af97fe1df63d4070602c3ce0c
          adressen=$(curl -fsS https://wersagtja.de/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          jq -n --arg k "$schluessel" --argjson u "$adressen" \
            '{host: "wersagtja.de", key: $k, keyLocation: "https://wersagtja.de/\($k).txt", urlList: $u}' |
            curl -fsS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @- https://api.indexnow.org/indexnow

name: Aufräumen

# Löscht liegen gebliebene Verbindungsnachrichten (älter als eine Stunde) aus der Firebase Realtime Database.
# Ohne das Secret FIREBASE_DATABASE_SECRET passiert nichts.
on:
  schedule:
    - cron: '23 3 * * *' # täglich
  workflow_dispatch:

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run aufraeumen
        env:
          FIREBASE_DATABASE_URL: https://politik-duell-quiz-default-rtdb.europe-west1.firebasedatabase.app
          FIREBASE_DATABASE_SECRET: ${{ secrets.FIREBASE_DATABASE_SECRET }}
